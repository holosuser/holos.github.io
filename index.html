<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLOS</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f9f9f9;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            text-align: center;
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #111;
        }
        p {
            color: #666;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #0070f3;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #0051cb;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>САЙТ ЗАХВАЧЕН МОССАДОМ. ГОИ НЕВЕРНЫЕ. ИЗРАИЛЬ ПОБЕДИТ</h1>
    </div>

</body>
</html>
